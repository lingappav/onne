[project]
name = "onne"
version = "0.1.0"
description = "The President's Rule — research, beat analysis & comparative literature toolkit"
authors = [{ name = "Shambhulingappa (Vishwa)" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onne"]

[tool.ruff]
line-length = 100
target-version = "py310"
