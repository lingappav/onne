<div class="fd-page">
  <div class="fd-page-header">
    <div class="fd-section-icon"><mat-icon>people_outline</mat-icon></div>
    <h2>Characters <span class="count-badge">{{ characters.length }}</span></h2>
  </div>

  <table mat-table [dataSource]="characters" class="chars-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let c"><code>{{ c.character_id }}</code></td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">
        <strong class="char-name">{{ c.full_name }}</strong>
        @if (c.aliases?.length) { <p class="char-alias">{{ c.aliases.join(' · ') }}</p> }
      </td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let c"><span class="role-badge role-{{ c.role.slice(0,4).toLowerCase() }}">{{ c.role }}</span></td>
    </ng-container>
    <ng-container matColumnDef="arc">
      <th mat-header-cell *matHeaderCellDef>Arc</th>
      <td mat-cell *matCellDef="let c"><span class="arc-text">{{ c.arc?.arc_type }}</span></td>
    </ng-container>
    <ng-container matColumnDef="appearances">
      <th mat-header-cell *matHeaderCellDef>Chapters</th>
      <td mat-cell *matCellDef="let c">
        <span class="ch-count">{{ c.chapters_present?.length ?? 0 }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let c">
        <a mat-icon-button [routerLink]="['/characters', c.character_id]"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button color="warn" (click)="deleteCharacter(c.character_id)"><mat-icon>delete_outline</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
